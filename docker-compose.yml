services:
  quickmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickmark
    restart: unless-stopped
    ports:
      - "9022:9022"
    volumes:
      # Mount data directory for database and assets persistence
      # This makes backups easy - just copy the ./data directory
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=9022
      - HOST=0.0.0.0
    healthcheck:
      # The slim Node image has no wget or curl, so check with Node itself
      test: ["CMD", "node", "-e", "fetch('http://localhost:9022').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Optional: Use a named volume instead of bind mount
# volumes:
#   quickmark_data:
#     driver: local
